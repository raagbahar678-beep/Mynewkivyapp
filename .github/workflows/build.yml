name: Build Kivy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip setuptools
          .venv/bin/pip install buildozer cython

      - name: Build APK
        run: .venv/bin/buildozer -v android debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MyKivyApp-APK
          path: bin/*.apk
          if-no-files-found: error
